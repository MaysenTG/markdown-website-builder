# Builds the Vite app and publishes dist/ to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Create the Pages site (Actions source) on the first run.
          enablement: true
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        env:
          # Repository variable (Settings → Secrets and variables → Actions → Variables).
          # Empty leaves AI editing off. Changing it requires a new Pages build.
          # Optional VITE_AI_GATE_TOKEN is also a variable; it is inlined into the JS bundle.
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL }}
          VITE_AI_GATE_TOKEN: ${{ vars.VITE_AI_GATE_TOKEN }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
